# Optional Render Blueprint — ensures DATABASE_URL stays linked to Postgres.
databases:
  - name: elevate-db
    plan: free
    databaseName: elevate
    user: elevate

services:
  - type: web
    name: elevate-cms
    runtime: python
    plan: free
    rootDir: CollegeManagement-Duale
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elevate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_DOMAIN
        value: abdimalikduale.com,www.abdimalikduale.com
      - key: DEBUG
        value: "False"
