# One service only — app + SQLite on a persistent disk (no separate PostgreSQL).
services:
  - type: web
    name: elevate-cms
    runtime: python
    plan: free
    rootDir: CollegeManagement-Duale
    buildCommand: ./build.sh
    startCommand: ./start.sh
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: USE_SQLITE
        value: "1"
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: RENDER_DISK_PATH
        value: /var/data
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_DOMAIN
        value: abdimalikduale.com,www.abdimalikduale.com
      - key: DEBUG
        value: "False"
      - key: DEFAULT_ADMIN_EMAIL
        value: amalikduale@gmail.com
